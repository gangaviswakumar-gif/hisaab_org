<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisaab — Record Visit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' } } } } }
    </script>
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .recording-pulse { animation: pulse-ring 2s infinite ease-in-out; }
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-primary-600 text-white p-2.5 rounded-xl shadow-md"><i class="fa-solid fa-notes-medical text-xl"></i></div>
                <div><h1 class="text-xl font-bold text-gray-900">Hisaab</h1><p class="text-xs text-gray-500">Voice-first ANM Assistant</p></div>
            </div>
        </div>
        <div class="bg-white border-t border-gray-100 px-4">
            <div class="max-w-7xl mx-auto flex space-x-2 py-2 text-sm font-medium">
                <a href="index.html" class="px-4 py-2 rounded-lg bg-primary-600 text-white shadow-sm"><i class="fa-solid fa-microphone mr-2"></i>Record Visit</a>
                <a href="confirm.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-file-pen mr-2"></i>Confirm & Edit</a>
                <a href="register.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-book-medical mr-2"></i>Register</a>
                <a href="alerts.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-triangle-exclamation mr-2 text-rose-500"></i>Alerts</a>
                <a href="claim.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-file-invoice-dollar mr-2"></i>Claim PDF</a>
                <a href="plan.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-route mr-2"></i>Plan My Day</a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
        <div class="text-center space-y-2">
            <h2 class="text-2xl font-bold text-gray-900">Record Antenatal Visit</h2>
            <p class="text-sm text-gray-600">Tap to start recording. It will stay active until you press stop.</p>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 text-center space-y-6 relative overflow-hidden">
            <div id="timerDisplay" class="text-3xl font-mono font-bold text-gray-400">0:00</div>
            
            <div class="relative flex items-center justify-center py-4">
                <div id="pulseRing" class="absolute w-36 h-36 rounded-full bg-primary-100 opacity-0 transition-all duration-300"></div>
                <button id="recordBtn" onclick="onRecordClick()" class="relative z-10 w-28 h-28 rounded-full bg-primary-600 hover:bg-primary-700 text-white shadow-xl flex flex-col items-center justify-center transition-transform active:scale-95 focus:outline-none">
                    <i id="recordBtnIcon" class="fa-solid fa-microphone text-3xl mb-1"></i>
                    <span id="recordBtnText" class="text-xs font-semibold uppercase tracking-wider">Tap to Record</span>
                </button>
            </div>

            <p id="recordStatusText" class="text-sm font-medium text-gray-500">Ready to record</p>

            <div id="processingOverlay" class="hidden absolute inset-0 bg-white/95 backdrop-blur-sm z-20 flex flex-col items-center justify-center space-y-3">
                <div class="w-12 h-12 border-4 border-primary-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-semibold text-gray-800 animate-pulse">Processing voice note & extracting schema...</p>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        function onRecordClick() {
            toggleDummyRecording((draft) => {
                window.location.href = "confirm.html";
            });
        }
    </script>
</body>
</html>
