<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisaab — MCH Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' } } } } }
    </script>
    <style>.serif-font { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-primary-600 text-white p-2.5 rounded-xl shadow-md"><i class="fa-solid fa-notes-medical text-xl"></i></div>
                <div><h1 class="text-xl font-bold text-gray-900">Hisaab</h1><p class="text-xs text-gray-500">Voice-first ANM Assistant</p></div>
            </div>
        </div>
        <div class="bg-white border-t border-gray-100 px-4">
            <div class="max-w-7xl mx-auto flex space-x-2 py-2 text-sm font-medium">
                <a href="index.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-microphone mr-2"></i>Record Visit</a>
                <a href="confirm.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-file-pen mr-2"></i>Confirm & Edit</a>
                <a href="register.html" class="px-4 py-2 rounded-lg bg-primary-600 text-white shadow-sm"><i class="fa-solid fa-book-medical mr-2"></i>Register</a>
                <a href="alerts.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-triangle-exclamation mr-2 text-rose-500"></i>Alerts</a>
                <a href="claim.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-file-invoice-dollar mr-2"></i>Claim PDF</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
            <div>
                <h2 class="text-xl font-bold text-gray-900 serif-font">MCH Mother & Child Register</h2>
                <p class="text-xs text-gray-500">Official digitized ANC register records, newest-first.</p>
            </div>
            <a href="index.html" class="bg-primary-600 hover:bg-primary-700 text-white text-xs px-4 py-2 rounded-lg font-semibold shadow flex items-center space-x-1.5">
                <i class="fa-solid fa-plus"></i><span>New Visit Voice Note</span>
            </a>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider serif-font border-b border-gray-200">
                            <th class="p-3">Patient Name / RCH</th>
                            <th class="p-3">Visit Date</th>
                            <th class="p-3">Weight</th>
                            <th class="p-3">BP (mmHg)</th>
                            <th class="p-3">Hb</th>
                            <th class="p-3">Symptoms</th>
                            <th class="p-3 text-center">HRP Flag</th>
                        </tr>
                    </thead>
                    <tbody id="registerTableBody" class="divide-y divide-gray-200 text-sm">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        const visits = getVisits();
        const tbody = document.getElementById('registerTableBody');
        tbody.innerHTML = '';

        if (visits.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-400">No visits recorded yet.</td></tr>`;
        } else {
            visits.forEach(v => {
                const tr = document.createElement('tr');
                tr.className = v.hrp_flag ? "bg-rose-50/60 hover:bg-rose-100/50" : "hover:bg-gray-50";
                const symptomsStr = Array.isArray(v.symptoms) ? v.symptoms.join(", ") : (v.symptoms || 'None');
                tr.innerHTML = `
                    <td class="p-3"><div class="font-bold text-gray-900">${v.name || 'Unnamed'}</div><div class="text-xs text-gray-500 font-mono">${v.rch_id || 'No ID'}</div></td>
                    <td class="p-3 text-xs text-gray-600">${v.visit_date || '-'}</td>
                    <td class="p-3 text-xs font-semibold text-gray-800">${v.weight_kg ? v.weight_kg + ' kg' : '-'}</td>
                    <td class="p-3 text-xs font-semibold ${v.bp_systolic >= 140 ? 'text-rose-600 font-bold' : 'text-gray-800'}">${v.bp_systolic || '-'}/${v.bp_diastolic || '-'}</td>
                    <td class="p-3 text-xs font-semibold ${v.hemoglobin < 11 ? 'text-amber-600' : 'text-gray-800'}">${v.hemoglobin ? v.hemoglobin + ' g/dL' : '-'}</td>
                    <td class="p-3 text-xs text-gray-600 max-w-xs truncate">${symptomsStr}</td>
                    <td class="p-3 text-center">${v.hrp_flag ? '<span class="inline-block w-3 h-3 rounded-full bg-rose-500 animate-pulse" title="HRP Flagged"></span>' : '<span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
