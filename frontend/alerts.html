<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisaab — Clinical Alerts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' } } } } }
    </script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-primary-600 text-white p-2.5 rounded-xl shadow-md"><i class="fa-solid fa-notes-medical text-xl"></i></div>
                <div><h1 class="text-xl font-bold text-gray-900">Hisaab</h1><p class="text-xs text-gray-500">Voice-first ANM Assistant</p></div>
            </div>
        </div>
        <div class="bg-white border-t border-gray-100 px-4">
            <div class="max-w-7xl mx-auto flex space-x-2 py-2 text-sm font-medium">
                <a href="index.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-microphone mr-2"></i>Record Visit</a>
                <a href="confirm.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-file-pen mr-2"></i>Confirm & Edit</a>
                <a href="register.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-book-medical mr-2"></i>Register</a>
                <a href="alerts.html" class="px-4 py-2 rounded-lg bg-primary-600 text-white shadow-sm"><i class="fa-solid fa-triangle-exclamation mr-2 text-rose-500"></i>Alerts</a>
                <a href="claim.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-file-invoice-dollar mr-2"></i>Claim PDF</a>
                <a href="plan.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-route mr-2"></i>Plan My Day</a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold text-gray-900">ANM Clinical Alerts & Flagged Cases</h2>
                <p class="text-xs text-gray-500">High-Risk Pregnancy (HRP) cases requiring intervention.</p>
            </div>
            <span id="alertHeaderCount" class="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded-full">0 Active Alerts</span>
        </div>

        <div id="alertsListContainer" class="space-y-4">
            <!-- Dynamically populated -->
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        (async function() {
            const flagged = await apiGetFlaggedVisits();
            document.getElementById('alertHeaderCount').innerText = `${flagged.length} Active Alerts`;
            const container = document.getElementById('alertsListContainer');
            container.innerHTML = '';

            if (flagged.length === 0) {
                container.innerHTML = `<div class="bg-emerald-50 border border-emerald-200 rounded-xl p-8 text-center"><h4 class="font-bold text-emerald-900">No Active Clinical Alerts</h4><p class="text-xs text-emerald-700 mt-1">All registered patient vitals are within safe parameters.</p></div>`;
            } else {
                flagged.forEach(f => {
                    const card = document.createElement('div');
                    card.className = "bg-white border-l-4 border-rose-500 rounded-xl p-5 shadow-sm space-y-3";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-gray-900 text-base">${f.name} <span class="text-xs font-normal text-gray-500 font-mono">(${f.rch_id})</span></h4>
                                <p class="text-xs text-gray-500">Visit Date: ${f.visit_date} | Mobile: ${f.mobile || 'N/A'}</p>
                            </div>
                            <span class="bg-rose-100 text-rose-700 text-xs font-bold px-2.5 py-1 rounded-lg">HRP Flagged</span>
                        </div>
                        <div class="bg-rose-50/50 p-3 rounded-lg border border-rose-100 space-y-1">
                            <span class="text-xs font-bold text-rose-800 uppercase tracking-wider block">Triggered Rules & Warnings:</span>
                            <ul class="list-disc list-inside text-xs text-rose-700 space-y-0.5">
                                ${(f.alerts && f.alerts.length ? f.alerts : ['High-risk indicator detected']).map(a => `<li>${a}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        })();
    </script>
</body>
</html>
