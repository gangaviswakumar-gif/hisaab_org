<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisaab — Claim PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' } } } } }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-primary-600 text-white p-2.5 rounded-xl shadow-md"><i class="fa-solid fa-notes-medical text-xl"></i></div>
                <div><h1 class="text-xl font-bold text-gray-900">Hisaab</h1><p class="text-xs text-gray-500">Voice-first ANM Assistant</p></div>
            </div>
        </div>
        <div class="bg-white border-t border-gray-100 px-4">
            <div class="max-w-7xl mx-auto flex space-x-2 py-2 text-sm font-medium">
                <a href="index.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-microphone mr-2"></i>Record Visit</a>
                <a href="confirm.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-file-pen mr-2"></i>Confirm & Edit</a>
                <a href="register.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-book-medical mr-2"></i>Register</a>
                <a href="alerts.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-triangle-exclamation mr-2 text-rose-500"></i>Alerts</a>
                <a href="claim.html" class="px-4 py-2 rounded-lg bg-primary-600 text-white shadow-sm"><i class="fa-solid fa-file-invoice-dollar mr-2"></i>Claim PDF</a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-file-invoice-dollar"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-900">ASH/ANM Incentive Claim Generator</h2>
                <p class="text-sm text-gray-600">Monthly verified tamper-evident submission claim PDF based on register visits.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 py-4 max-w-xl mx-auto text-left">
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <span class="text-xs text-gray-500 block">Total Verified Visits</span>
                    <span id="claimTotalVisits" class="text-xl font-bold text-gray-900">0</span>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <span class="text-xs text-gray-500 block">Rate per Visit</span>
                    <span class="text-xl font-bold text-gray-900">₹150</span>
                </div>
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                    <span class="text-xs text-emerald-700 block">Total Claim Amount</span>
                    <span id="claimTotalAmount" class="text-xl font-bold text-emerald-800">₹0</span>
                </div>
            </div>

            <button onclick="downloadClaimPDF()" class="bg-primary-600 hover:bg-primary-700 text-white font-semibold px-8 py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2 mx-auto">
                <i class="fa-solid fa-file-arrow-down"></i><span>Download Verified Claim PDF</span>
            </button>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        (async function() {
            const visits = await apiGetVisits();
            document.getElementById('claimTotalVisits').innerText = visits.length;
        })();

        async function downloadClaimPDF() {
            const success = await apiGenerateClaim();
            if (!success) alert('Failed to generate PDF. Check server logs.');
        }
    </script>
</body>
</html>
